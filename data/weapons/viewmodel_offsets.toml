# Viewmodel offsets (T-054): where the game's arms-and-weapon model sits relative to the controller.
#
# Values are [forward, left, up, pitch, yaw, roll] in the controller's aim frame: metres along id Tech's
# forward, left and up axes, then degrees (pitch positive down, yaw counter-clockwise). The game authors
# each viewmodel relative to the eye, so the offset moves the model's origin (the eye) back from the hand
# by the distance the gun is drawn ahead, right and below the eye.
#
# Keys are the held item's inventory decl name: the base weapon's, which a weapon mod does not change, so one
# row covers every mod of a weapon ([sights] below can name a mod). A name without its own entry uses the entry
# of the longest key it starts with followed by '_' ("weapon/player/fists_doom5melee" uses
# "weapon/player/fists"), then "default".
#
# Each weapon's row puts the glove's grip on the gun at the controller's grip: the right glove's wrist (the
# arms model's right hand joint, as the game animates the weapon at idle) lands where the off hand's wrist
# goes, 8 cm behind the grip's centre and 3.5 cm toward the back of the hand, with the model's rotation
# unchanged. Row = (-0.08, -0.035, 0) less the wrist's position in the model's frame, the [sights] turn taken
# into account. The wrist positions are measured on the hands rig (docs/rig-findings/hands-rig.md, section 10).
# The chaingun's and the ballista's idles hold the gun by its rear top handle, the glove turned across a
# controller's grip; the weapon arm puts the glove on a grip instead ([right_grip] below), and their rows put
# that wrist on the target like the others' (measured with the glove there). The Unmaykr's idle holds it with
# the guns' grip. The Crucible's idle holds the hilt in the right fist turned 37 degrees from the guns' grip,
# so its row also turns the model (nothing on it aims: its swing hands the arm back to the game) until the
# glove sits as on the guns, with the hilt in the fist as the game holds it (its offset is the target less the
# wrist as turned). The swim's fists (held while the player is under water) are placed by the same rule from
# their idle: the game's swim stroke moves the glove's wrist up to 11 cm about that point, mostly side to
# side. "default" is the first estimate, not measured: the fists (a melee's are out only while the arm is
# handed back to the game; the Berserk's not brought out on the rig), the chainsaw (its button is a quick
# action that hands the arm back; held as a weapon only with no gun left in the inventory), the Sentinel
# Hammer (not brought out on the rig; its throw and slam hand the arm back) and anything new. Measured:
# docs/rig-findings/hands-rig.md, sections 12 and 16.
# ETERNALVR_VIEWMODEL_OFFSET replaces a row on the rig.
#
# No [seated] rows: seated play uses the same ones, since the glove follows the real hand in either posture.
#
# The layer keeps that wrist target in the controller grip's own frame while the gun keeps the aim ray's
# orientation (on a headset the grip is turned from the aim ray; the simulator gives both one pose). The rows
# are measured with the sights turn on: with ETERNALVR_WEAPON_SIGHTS=0 (rig and debugging only) the wrist lands
# up to 0.3 cm off target (8.7 cm turned by at most 2.2 degrees). With the weapon in the left hand the same rows
# place the model, their turn reflected, then move it until the left glove's wrist sits in the left hand by the
# same rule (docs/VR_HANDS_HUD.md, "The weapon in the left hand").

[standing]
"default" = [-0.25, 0.18, 0.22, 0, 0, 0]
"weapon/player/shotgun" = [-0.183, 0.131, 0.223]
"weapon/player/heavy_cannon" = [-0.270, 0.114, 0.209]
"weapon/player/plasma_rifle" = [-0.025, 0.201, 0.362]
"weapon/player/rocket_launcher" = [-0.344, 0.148, 0.215]
"weapon/player/double_barrel" = [-0.195, 0.135, 0.225]
"weapon/player/gauss_rifle" = [-0.326, 0.173, 0.384]
"weapon/player/chaingun" = [-0.615, 0.166, 0.325]
"weapon/player/bfg" = [-0.355, 0.094, 0.383]
"weapon/player/unmaykr" = [-0.245, 0.194, 0.356]
"weapon/player/crucible" = [-0.493, 0.496, -0.060, -24.39, -23.75, -10.59]
"weapon/player/fists_swim" = [-0.493, 0.264, 0.177]

# Weapon sights (on by default, T-135; ETERNALVR_WEAPON_SIGHTS=0 turns them off on the rig): [pitch, yaw] in
# degrees (pitch positive down, yaw counter-clockwise) is the direction of the weapon's sight line in the arms
# model's frame as the game animates it at idle. The model is turned about the grip so that line runs parallel
# to the aim ray: the sights then point where the shots go, offset from the ray by the sights' fixed height
# and side above the hand. Same key rules, but no "default": a weapon without a row is not turned (the BFG and
# the Unmaykr, whose bores run within 0.06 degrees of the ray as the game holds them; the fists, chainsaw,
# Crucible and hammer, which have no sights). A mod that changes the sight line can have its own row, keyed by
# the weapon decl the mod puts in the held weapon while it is active (as "weapon/player/heavy_cannon_bolt_action"
# for the Precision Bolt); it wins over the weapon's row while that mod is active, from the next frame after a
# mod switch, and turns the gun about the glove's wrist so the hand stays where the weapon's row above puts it.
# No mod has one now: the Heavy Cannon's two mods share one sight line (DECISIONS T-206).
# Each row is the sight line in the weapon's own frame (noted per row) turned by the idle pose the hands rig
# measured: the centre of its spread over five held controller poses (docs/rig-findings/hands-rig.md, sections
# 6 and 18), which keeps the idle sway's worst case smallest: about 0.15 to 0.2 degrees either side.
[sights]
# Receiver top to the bead; the idle pose toes the gun in about 2.2 degrees.
"weapon/player/shotgun" = [0.21, 2.17]
# The front sight is a ring; its centre seen from the eye point of the game's own zoom pose, 0.2 degrees above
# the bore. The Precision Bolt's scope tube runs on the same line within 2 mm, so it is one row for every mod
# (no mod, the Precision Bolt, the Micro Missiles).
"weapon/player/heavy_cannon" = [-0.15, 0.15]
# The zoom pose's eye axis.
"weapon/player/chaingun" = [0.32, -0.01]
# Rear sight top to the muzzle top (mesh fit, low confidence).
"weapon/player/double_barrel" = [0.69, 0.16]
# The bore (no sight parts); the idle pose tilts the gun up and in.
"weapon/player/gauss_rifle" = [-0.83, 1.08]
# The bore (no sight parts).
"weapon/player/plasma_rifle" = [-0.14, 0.00]
# The bore (no sight parts).
"weapon/player/rocket_launcher" = [0.04, 0.14]

# The right glove on a grip (docs/VR_HANDS_HUD.md, "The glove on the grip"): weapons whose idle animations hold
# the gun by a handle turned well away from how a hand holds a controller (the chaingun's and the ballista's rear
# top handle, 78 and 73 degrees from every other gun's grip), and the game grip the weapon arm closes the glove
# in instead; the gun stays where the game puts it. "heavy_cannon" is the Heavy Cannon's idle hand, which the
# chaingun's own zoom and reload hold the chaingun with, at the wrist it has on the Heavy Cannon (the weapon's
# root joint plus (-0.170, -0.040, -0.074) m). ["heavy_cannon", forward, left, up] puts that grip's wrist
# elsewhere on the gun, in the root joint's frame: the ballista has no grip under it, so its fist closes on the
# ridge under its stock. Same key rules, no "default": a weapon without a row keeps the glove where the game
# animates it.
[right_grip]
"weapon/player/chaingun" = "heavy_cannon"
"weapon/player/gauss_rifle" = ["heavy_cannon", -0.302, -0.039, -0.181]

# With the weapon in the left hand and the game's off hand (ETERNALVR_OFFHAND=game, the default), the right glove
# holds the gun in the game's left grip reflected across the gun's middle (DECISIONS T-140). The chaingun's front
# handle is on its left side only: reflected, the right glove's finger joints sit 10 to 17 cm from the gun's mesh
# (2.5 to 6 cm as the game's left glove holds the handle), a fist closed on nothing beside the gun. "controller":
# on such a weapon the right glove follows the right controller instead, as with the free off hand (DECISIONS
# T-141). Every other gun's left grip, reflected, is as close to its mesh as the game's (the meshes are
# symmetric there). Same key rules, no "default".
[left_handed_off_hand]
"weapon/player/chaingun" = "controller"

# With the weapon in the left hand the model is placed so the left glove's wrist on the gun, where the game's own
# grip of the held item reflected puts it, sits in the left hand (docs/VR_HANDS_HUD.md, "The weapon in the left
# hand"). That grip is read from the game's arm once the item idles, so on an item's first raise of a session
# its row places the model until then (DECISIONS T-146, T-219). [forward, left, up], metres in the arms model's
# frame: the left glove's wrist on the item at idle as the game's grip puts it (measured on the hands rig: the
# posed left wrist's median over the item's idle, four runs within 0.3 mm). The read grip then replaces the row;
# the log gives their distance. Without a row an item sits by the right glove's row until its grip is read and
# then moves into the left hand (by 0.8 to 2.4 cm on the guns, 68.6 cm and 59 degrees on the Crucible, whose row
# turns the model). Same key rules, no "default": an item without a row is placed for the right glove until its
# grip is read.
[left_hand_wrist]
"weapon/player/shotgun" = [0.101, -0.081, -0.227]
"weapon/player/heavy_cannon" = [0.190, -0.069, -0.211]
"weapon/player/plasma_rifle" = [-0.055, -0.157, -0.362]
"weapon/player/rocket_launcher" = [0.264, -0.101, -0.215]
"weapon/player/double_barrel" = [0.115, -0.077, -0.227]
"weapon/player/gauss_rifle" = [0.245, -0.132, -0.385]
"weapon/player/chaingun" = [0.535, -0.122, -0.334]
"weapon/player/bfg" = [0.275, -0.049, -0.383]
"weapon/player/unmaykr" = [0.165, -0.154, -0.356]
"weapon/player/crucible" = [0.681, -0.240, -0.266]

# The weapon hand's index finger on the trigger (docs/VR_HANDS_HUD.md, "The index finger on the trigger"): the
# guns whose index finger follows the weapon-hand controller's trigger while the layer poses the arm, each with
# its lift, the share (0 to 1) the finger opens from the game's grip toward straight while it is off the trigger.
# Touched, it rests a little open on the trigger; pulled, it closes to the game's own grip, so it never goes
# further into the gun than the game's animation puts it. The chaingun and the ballista hold the Heavy Cannon's
# grip ([right_grip]), so their finger opens from that grip. Same key rules, no "default": an item without a row
# (the Crucible, the fists, the chainsaw, the hammer) keeps the game's finger.
[trigger_finger]
"weapon/player/shotgun" = 0.7
"weapon/player/heavy_cannon" = 0.7
"weapon/player/plasma_rifle" = 0.7
"weapon/player/rocket_launcher" = 0.7
"weapon/player/double_barrel" = 0.7
"weapon/player/gauss_rifle" = 0.7
"weapon/player/chaingun" = 0.7
"weapon/player/bfg" = 0.7
"weapon/player/unmaykr" = 0.7
# Two-handed aim (docs/VR_HANDS_HUD.md, "Two-handed aim"; DECISIONS T-156): the support point, where the off
# glove's grip sits on the gun as the game's own idle holds the fore-end or the shroud with the left hand.
# [forward, left, up], metres in the weapon controller's aim frame from its grip: the game's left wrist on the gun
# (its pose under the left attach joint, placed on the gun's root) with the off hand's wrist offset undone, less
# the controller's grip, the median over the grip sweep's neutral holds (docs/rig-findings/hands-rig.md, section
# 27; two runs within 1.3 cm, the Heavy Cannon's idle sway, and within 0.1 cm on every other gun). With the
# weapon in the left hand the row is reflected (left negated): the left-handed sweep's right glove on the
# reflected grip gives the same points within 0.6 cm (the Heavy Cannon 2.2 cm, its sway). Same key rules, no
# "default": an item without a row takes no support grip. Not here: the chaingun (the game's left hand holds a
# handle on its side, 37 cm left of the weapon glove and 75 degrees from the barrel: the line between the hands
# would roll the gun about its barrel, not point it; with the weapon in the left hand that handle is not under
# the right hand at all, DECISIONS T-141), and the items held in one hand or swung: the Crucible, the Sentinel
# Hammer, the chainsaw and the fists (the Berserk's, a melee's and the swim's).
[two_hand]
"weapon/player/shotgun" = [0.296, 0.006, 0.057]
"weapon/player/double_barrel" = [0.287, 0.004, 0.048]
"weapon/player/heavy_cannon" = [0.388, -0.003, 0.014]
"weapon/player/plasma_rifle" = [0.756, -0.015, 0.093]
"weapon/player/rocket_launcher" = [0.163, 0.003, -0.004]
