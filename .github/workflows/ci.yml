name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Any branch, by hand: gh workflow run CI --ref <branch>.
  workflow_dispatch:
  # A release just published is checked against its own checksums (job "Published release").
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Check includes
        run: python3 tools/check_includes.py

      - name: Check file sizes
        run: python3 tools/check_file_size.py

      # Engine internals (signatures, game addresses and offsets, hook registers, id Tech type names) only in
      # src/vkcore, src/engine/eternal and src/game/eternal (DECISIONS T-236).
      - name: Check that engine internals stay in their folders
        run: python3 tools/check_scope.py

      # One pinned version, because clang-format releases format some constructs differently. A venv
      # keeps pip away from the runner's system Python.
      - name: Check formatting (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet clang-format==18.1.8
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 "$RUNNER_TEMP/clang-format/bin/clang-format" --dry-run --Werror

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        run: ctest --preset windows-msvc

      # The rig scripts' own tests (T-108): the build's test app plays the game, with fake settings trees; no game,
      # Steam or display is touched.
      - name: Test rig scripts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/rig/tests/run-tests.ps1

      # Sources only (versions agree, tester docs and notices present); no build, game or GPU needed.
      - name: Validate release sources
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/make-release.ps1 -Validate

  # clang-tidy over all of src/ with the windows-msvc build's compile commands (REQ-18): any finding not in
  # tools/clang_tidy_baseline.txt fails the job. A job of its own beside the MSVC build, since configuring is all
  # clang-tidy needs (the generated sources and the fetched dependencies come from the configure).
  clang-tidy:
    name: clang-tidy (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc

      # The version the baseline was made with, not the runner's own LLVM: LLVM's release archive, checked against
      # the SHA256 pinned in the script before anything is unpacked.
      - name: Install clang-tidy
        run: |
          python -m venv "$env:RUNNER_TEMP\tidy-venv"
          & "$env:RUNNER_TEMP\tidy-venv\Scripts\python" -m pip install --quiet zstandard==0.25.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\tidy-venv\Scripts\python" tools/fetch_clang_tidy.py --out "$env:RUNNER_TEMP\clang-tidy"
          exit $LASTEXITCODE

      - name: Test the clang-tidy scripts
        run: python -m unittest discover -s tools/tests

      - name: clang-tidy
        run: python tools/run_clang_tidy.py --clang-tidy "$env:RUNNER_TEMP\clang-tidy\bin\clang-tidy.exe"

  launcher:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      # The portable core and its tests run on any OS (ARCHITECTURE section 15).
      - name: Test launcher core
        run: dotnet test launcher/tests/EternalVR.Launcher.Core.Tests -c Release

      - name: Build launcher (Windows)
        if: runner.os == 'Windows'
        run: dotnet build launcher/EternalVR.sln -c Release

  release:
    name: Published release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The public repository's newest release (or the one just published): the uploaded zip against its .sha256 and
      # GitHub's digest, every file in it against its SHA256SUMS.txt, and BUILD-INFO.txt's supported builds (T-105).
      - name: Verify the release against its checksums
        shell: powershell
        # The tag reaches the script as data through the environment, never as part of the command line.
        env:
          GH_TOKEN: ${{ github.token }}
          EVR_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:EVR_TAG) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify-release.ps1 -Repo ArcadaLabs-Jason/EternalVR -Tag "$env:EVR_TAG" -WaitSeconds 600
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify-release.ps1 -Repo ArcadaLabs-Jason/EternalVR
          }
          exit $LASTEXITCODE
